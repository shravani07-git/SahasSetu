# Dev infrastructure — MongoDB + Redis + optional ML/voice service
# Run the Next.js app separately with: pnpm dev
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm dev

services:
  # ML service for BiLSTM, TF-IDF and voice reporting
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: safeher-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BILSTM_MODEL_PATH=/app/artifacts/harassment_bilstm.pt
      - BILSTM_METADATA_PATH=/app/artifacts/metadata.json
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - HF_TOKEN=${HF_TOKEN:-}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-dev-ml-service-key-change-me}
    volumes:
      - ./ml-service/artifacts:/app/artifacts
      - hf_cache:/app/.cache/huggingface

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: safeher-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-safeher_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: safeher
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis for Session Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: safeher-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  hf_cache:
    driver: local
