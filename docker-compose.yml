version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safeher-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-safeher_admin}:${MONGO_ROOT_PASSWORD:-change-me}@mongodb:27017/safeher?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-with-a-long-random-secret}
      - JWT_EXPIRES_IN=7d
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-replace-with-64-hex-characters}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - UPLOAD_DIR=/app/uploads
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-dev-ml-service-key-change-me}
      - EVIDENCE_SIGNING_KEY=${EVIDENCE_SIGNING_KEY:-change-me-in-production-with-at-least-32-random-characters}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - safeher-network

  # Python ML / Voice service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: safeher-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BILSTM_MODEL_PATH=/app/artifacts/harassment_bilstm.pt
      - BILSTM_METADATA_PATH=/app/artifacts/metadata.json
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - HF_TOKEN=${HF_TOKEN:-}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-dev-ml-service-key-change-me}
    volumes:
      - ./ml-service/artifacts:/app/artifacts
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - safeher-network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: safeher-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-safeher_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: safeher
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - safeher-network

  # Redis for Session Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: safeher-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safeher-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  upload_data:
    driver: local
  hf_cache:
    driver: local

networks:
  safeher-network:
    driver: bridge
